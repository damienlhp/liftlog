<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ exercise.name }} — Progress</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
    <a class="back-link" href="javascript:history.back()">← Back</a>
    <h1>{{ exercise.name }}</h1>
    <p class="exercise-muscle-group">{{ exercise.muscle_group }}</p>

    <div class="stat-card-row">
        <div class="stat-card">
            <p class="stat-eyebrow">Current Max</p>
            <p class="stat-value">{{ current_max }}</p>
        </div>
        <div class="stat-card">
            <p class="stat-eyebrow">All-time Best</p>
            <p class="stat-value">{{ all_time_best }}</p>
        </div>
    </div>

    <!-- Tab buttons -->
    <div class="tab-bar">
        <button class="tab-btn" onclick="showChart('strength')" id="tab-strength">Strength</button>
        <button class="tab-btn" onclick="showChart('reps')" id="tab-reps">Reps</button>
        <button class="tab-btn" onclick="showChart('volume')" id="tab-volume">Volume</button>
    </div>

    <!-- Charts -->
    <div id="chart-strength" class="chart-container"><canvas id="strengthChart"></canvas></div>
    <div id="chart-reps" class="chart-container" style="display:none"><canvas id="repsChart"></canvas></div>
    <div id="chart-volume" class="chart-container" style="display:none"><canvas id="volumeChart"></canvas></div>

    <script>
        const strengthDates = {{ strength_dates | tojson }};
        const strengthValues = {{ strength_values | tojson }};
        const repsDates = {{ reps_dates | tojson }};
        const repsValues = {{ reps_values | tojson }};
        const volumeDates = {{ volume_dates | tojson }};
        const volumeValues = {{ volume_values | tojson }};
    </script>

    <script>
        function getCssVar(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }

        const textSecondary = getCssVar('--text-secondary');
        const textPrimary = getCssVar('--text-primary');
        const borderColor = getCssVar('--border-color');

        function makeChart(id, labels, data, label, color) {
            return new Chart(document.getElementById(id).getContext("2d"), {
                type: "line",
                data: {
                    labels: labels,
                    datasets: [{
                        label: label,
                        data: data,
                        borderColor: color,
                        backgroundColor: color.replace("1)", "0.1)"),
                        tension: 0.1,
                        fill: true,
                        pointRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            ticks: { color: textSecondary },
                            grid: { color: borderColor }
                        },
                        x: {
                            ticks: { color: textSecondary },
                            grid: { color: borderColor }
                        }
                    }
                }
            });
        }

        makeChart("strengthChart", strengthDates, strengthValues, "Max Weight", "rgba(75, 192, 192, 1)");
        makeChart("repsChart", repsDates, repsValues, "Total Reps", "rgba(153, 102, 255, 1)");
        makeChart("volumeChart", volumeDates, volumeValues, "Volume", "rgba(255, 159, 64, 1)");

        function showChart(type) {
            ["strength", "reps", "volume"].forEach(function(t) {
                document.getElementById("chart-" + t).style.display = (t === type) ? "block" : "none";
                document.getElementById("tab-" + t).classList.toggle("active", t === type);
            });
        }

        showChart("strength");
    </script>
</body>
</html>
