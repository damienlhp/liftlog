<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiftLog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Accent color picker: theme.js fills this div with clickable circles -->
    <div class="theme-picker" id="theme-picker"></div>

    <h1>LiftLog</h1>

    <h2>My Workout Splits</h2>
    {% if splits %}
        {% for split in splits %}
            <div class="split-card">
                <h3>{{ split.name }}</h3>
                <div class="split-actions">
                    <a class="btn btn-secondary" href="/split/{{ split.id }}">View Split</a>
                    <a class="btn btn-primary" href="/log/{{ split.id }}">Log Workout</a>
                    <form action="/split/{{ split.id }}/delete" method="POST" style="display:inline;">
                        <button type="submit" class="btn btn-danger" onclick="return confirm('Delete {{ split.name }}?')">Delete</button>
                    </form>
                </div>
            </div>
        {% endfor %}
    {% else %}
        <p class="empty-state">You have no workout splits yet.</p>
    {% endif %}

    <a class="add-split-link" href="/create-split">+ Create a Workout Split</a>

    <hr>
    <h2>Exercises</h2>
    <a class="btn btn-secondary" href="/exercises">Manage Exercises</a>
    <a class="btn btn-secondary" href="/progress">My Progress</a>

    <hr>
    <!-- Mini 2-week calendar -->
    <h2>Last 2 Weeks</h2>
    <div id="calendar-container" class="calendar-section" onclick="openFullCalendar()">
        <div class="calendar-header-row">
            <span class="date-range" id="date-range"></span>
            <span><span class="active-days-count" id="active-days-count"></span> <span class="active-days-label">active days</span></span>
        </div>
        <div class="calendar-weekdays">
            <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
        </div>
        <div id="calendar-grid" class="calendar-grid"></div>
    </div>

    <!-- Full calendar modal -->
    <div id="full-cal-overlay" class="full-cal-overlay" onclick="closeFullCalendar()"></div>
    <div id="full-cal-modal" class="full-cal-modal">
        <div class="full-cal-header">
            <button onclick="changeYear(-1)" class="cal-nav-btn">‹</button>
            <span id="cal-year-label" class="cal-year-label"></span>
            <button onclick="changeYear(1)" class="cal-nav-btn">›</button>
            <button onclick="closeFullCalendar()" class="cal-nav-btn" style="margin-left:16px;">✕</button>
        </div>
        <div id="full-cal-body"></div>
    </div>

    <!-- Workout detail panel -->
    <div id="detail-overlay" class="detail-overlay" onclick="closeDetailPanel()"></div>
    <div id="detail-panel" class="detail-panel">
        <div class="detail-header">
            <h3 id="detail-date"></h3>
            <button onclick="closeDetailPanel()" class="detail-close">✕</button>
        </div>
        <p class="detail-subtitle" id="detail-subtitle"></p>
        <div id="detail-content" class="detail-content"></div>
    </div>

    <!-- theme.js sets up the color picker above -->
    <script src="{{ url_for('static', filename='theme.js') }}"></script>

    <script>
        const workoutDates = {{ workout_dates | tojson }};
        const today = "{{ today }}";
        const twoWeeksAgo = "{{ two_weeks_ago }}";
        const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
        const monthNamesShort = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
        const dayNamesFull = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
        const dayHeaders = ["S","M","T","W","T","F","S"];

        // --- Mini calendar ---
        const startDate = new Date(twoWeeksAgo + "T00:00:00");
        const endDate = new Date(today + "T00:00:00");

        document.getElementById("date-range").textContent =
            monthNamesShort[startDate.getMonth()] + " " + startDate.getDate() +
            " - " +
            monthNamesShort[endDate.getMonth()] + " " + endDate.getDate();
        document.getElementById("active-days-count").textContent = workoutDates.length;

        const grid = document.getElementById("calendar-grid");
        const firstDayOfWeek = startDate.getDay();
        for (let i = 0; i < firstDayOfWeek; i++) {
            grid.appendChild(document.createElement("div"));
        }
        let current = new Date(startDate);
        while (current <= endDate) {
            const dateStr = current.toISOString().split("T")[0];
            const isActive = workoutDates.includes(dateStr);
            const isToday = dateStr === today;

            const cell = document.createElement("div");
            cell.className = "cal-cell" + (isActive ? " active" : "") + (isToday && !isActive ? " today" : "");
            cell.innerHTML = current.getDate() + (isActive ? '<div class="cal-dot"></div>' : "");
            grid.appendChild(cell);

            current.setDate(current.getDate() + 1);
        }

        // --- Full calendar ---
        let allWorkoutDates = [];
        let allWorkoutDetails = {};
        let currentCalYear = new Date().getFullYear();

        function openFullCalendar() {
            fetch("/calendar-data")
                .then(function(response) { return response.json(); })
                .then(function(data) {
                    allWorkoutDates = data.workout_dates;
                    allWorkoutDetails = data.workout_details;
                    renderFullCalendar(currentCalYear);
                    document.getElementById("full-cal-overlay").style.display = "block";
                    document.getElementById("full-cal-modal").style.display = "block";
                    setTimeout(function() {
                        document.getElementById("full-cal-modal").classList.add("open");
                    }, 10);
                });
        }

        function closeFullCalendar() {
            document.getElementById("full-cal-modal").classList.remove("open");
            setTimeout(function() {
                document.getElementById("full-cal-modal").style.display = "none";
                document.getElementById("full-cal-overlay").style.display = "none";
            }, 300);
        }

        function changeYear(direction) {
            currentCalYear += direction;
            renderFullCalendar(currentCalYear);
        }

        function renderFullCalendar(year) {
            document.getElementById("cal-year-label").textContent = year;
            const body = document.getElementById("full-cal-body");
            body.innerHTML = "";
            const todayStr = today;

            for (let month = 0; month < 12; month++) {
                const monthTitle = document.createElement("h3");
                monthTitle.textContent = monthNames[month] + " " + year;
                monthTitle.className = "month-title";
                body.appendChild(monthTitle);

                const headerGrid = document.createElement("div");
                headerGrid.className = "month-grid";
                dayHeaders.forEach(function(d) {
                    const h = document.createElement("div");
                    h.className = "month-day-header";
                    h.textContent = d;
                    headerGrid.appendChild(h);
                });
                body.appendChild(headerGrid);

                const dayGrid = document.createElement("div");
                dayGrid.className = "month-grid";

                const firstDay = new Date(year, month, 1).getDay();
                for (let i = 0; i < firstDay; i++) {
                    dayGrid.appendChild(document.createElement("div"));
                }

                const daysInMonth = new Date(year, month + 1, 0).getDate();
                for (let d = 1; d <= daysInMonth; d++) {
                    const dateStr = year + "-" +
                        String(month + 1).padStart(2, "0") + "-" +
                        String(d).padStart(2, "0");
                    const hasWorkout = allWorkoutDates.includes(dateStr);
                    const isToday = dateStr === todayStr;

                    const cell = document.createElement("div");
                    cell.className = "month-day" +
                        (hasWorkout ? " has-workout" : "") +
                        (isToday ? " is-today" : "");

                    cell.innerHTML = d + (hasWorkout ?
                        '<div class="dot"></div>' : "");

                    if (hasWorkout) {
                        cell.onclick = function() { openDetailPanel(dateStr); };
                    }

                    dayGrid.appendChild(cell);
                }

                body.appendChild(dayGrid);
            }   
        }

        // Step 1: click a date -> show the simple summary card (day name, sets, exercises)
        function openDetailPanel(date) {
            const details = allWorkoutDetails[date] || { day_name: "Workout", total_sets: 0, exercise_count: 0 };
            const dateObj = new Date(date + "T00:00:00");
            const formattedDate = dayNamesFull[dateObj.getDay()] + ", " + monthNames[dateObj.getMonth()] + " " + dateObj.getDate();

            document.getElementById("detail-date").textContent = formattedDate;
            document.getElementById("detail-subtitle").textContent = "1 workout logged";

            const content = document.getElementById("detail-content");
            content.innerHTML = `
                <div class="detail-content" onclick="showFullWorkoutDetail('${date}', '${details.day_name}')" style="cursor:pointer;">
                    <p class="detail-day-name">${details.day_name}</p>
                    <p class="detail-stats">${details.total_sets} sets · ${details.exercise_count} exercises</p>
                </div>
            `;

            document.getElementById("detail-overlay").style.display = "block";
            document.getElementById("detail-panel").style.display = "block";
            setTimeout(function() {
                document.getElementById("detail-panel").classList.add("open");
            }, 10);
        }

        // Step 2: click the summary card -> fetch and show full duration/PR/exercise breakdown
        function showFullWorkoutDetail(date, dayName) {
            const content = document.getElementById("detail-content");
            content.innerHTML = `<p>Loading...</p>`;

            fetch(`/workout-detail/${date}`)
                .then(res => res.json())
                .then(data => {
                    let exercisesHtml = data.exercises.map(ex => {
                        let setsHtml = ex.sets.map(s => `
                            <div class="detail-set-row ${s.is_pr ? 'is-pr' : ''}">
                                <span>Set ${s.set_number}</span>
                                <span>${s.weight} ${s.unit} × ${s.reps}</span>
                                ${s.is_pr ? '<span class="pr-badge">PR</span>' : ''}
                            </div>
                        `).join("");

                        return `
                            <div class="detail-exercise-block">
                                <h4>${ex.name} <span class="text-secondary">(${ex.muscle_group})</span></h4>
                                ${setsHtml}
                            </div>
                        `;
                    }).join("");

                    let minutes = Math.floor(data.duration_seconds / 60);
                    let seconds = String(data.duration_seconds % 60).padStart(2, "0");

                    content.innerHTML = `
                        <div class="stat-card-row">
                            <div class="stat-card">
                                <div class="stat-eyebrow">Duration</div>
                                <div class="stat-value">${minutes}:${seconds}</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-eyebrow">Exercises</div>
                                <div class="stat-value">${data.exercise_count}</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-eyebrow">PRs</div>
                                <div class="stat-value">${data.total_prs}</div>
                            </div>
                        </div>
                        ${exercisesHtml}
                    `;
                });
        }

        function closeDetailPanel() {
            document.getElementById("detail-panel").classList.remove("open");
            setTimeout(function() {
                document.getElementById("detail-panel").style.display = "none";
                document.getElementById("detail-overlay").style.display = "none";
            }, 300);
        }
    </script>
</body>
</html>
