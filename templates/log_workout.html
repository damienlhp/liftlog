<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Workout - LiftLog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
    <a class="back-link" href="/">← Back to Home</a>
    <h1>Log a Workout</h1>

    <form action="/log-workout" method="POST">
        <div class="form-section">
            <label class="form-label">Exercise</label>
            <select name="exercise_id" class="select-input w-full">
                {% for exercise in exercises %}
                    <option value="{{ exercise.id }}">{{ exercise.name }} - {{ exercise.muscle_group }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-section">
            <label class="form-label">Date</label>
            <input type="date" name="date" class="text-input w-full" required>
        </div>

        <h3>Sets</h3>

        <div id="sets-container">
            <div class="set-row">
                <label class="set-label">Set 1</label>
                <input type="number" class="text-input set-input weight-input" name="weight_1" placeholder="Weight (lbs)" step="0.5" required>
                <input type="number" class="text-input set-input-sm" name="reps_1" placeholder="Reps" required>
            </div>
        </div>

        <div class="form-section">
            <button type="button" class="btn btn-secondary btn-sm" onclick="addSet()">+ Add Set</button>
            <button type="submit" class="btn btn-primary">Save Workout</button>
        </div>
    </form>

    <script>
        let setCount = 1;

        function addSet() {
            setCount++;
            const container = document.getElementById("sets-container");
            const div = document.createElement("div");
            div.className = "set-row";
            div.innerHTML = `
                <label class="set-label">Set ${setCount}</label>
                <input type="number" class="text-input set-input weight-input" name="weight_${setCount}" placeholder="Weight (lbs)" step="0.5" required>
                <input type="number" class="text-input set-input-sm" name="reps_${setCount}" placeholder="Reps" required>
            `;
            container.appendChild(div);
        }
    </script>
</body>
</html>
